<style>:root{color-scheme:light;--ink:#202922;--muted:#586359;--paper:#f6f5ee;--line:#d8ded4;--red:#9f233b;--blue:#15596f;--green:#216044;--gold:#825300;--white:#fff;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

ck;margin-bottom:4px}.casebar .caseid{margin-left:auto;font:12px var(--mono);color:var(--muted);align-self:center}.statusline{font-size:13px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px}.mission{padding:21px 24px;background:#e9eee5;border-left:4px solid var(--green);margin:0 0 24px;border-radius:0 6px 6px 0}.mission h2{font-size:19px;margin:0 0 7px;line-height:1.35;letter-spacing:-.015em}.mission p{margin:0;font-size:15px}.workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:26px;align-items:start}.display{min-width:0}.plot{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}.plot svg{display:block;width:100%;height:auto}.plot text{font:12px var(--mono);fill:#425044}.legend{font-size:12px;color:var(--muted);margin:10px 0 18px;display:flex;gap:15px;flex-wrap:wrap}.legend b{font-size:16px;vertical-align:-1px;margin-right:3px}.legend .red{color:var(--red)}.legend .blue{color:var(--blue)}.metrics{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.metric{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}.metric span{font-size:12px;display:block;color:var(--muted)}.metric strong{font:600 22px var(--mono);display:block;margin-top:3px}.controlpanel{background:#fff;border:1px solid var(--line);border-radius:7px;padding:21px;min-width:0}.controlpanel h2{font-size:16px;margin:0 0 15px}.controls{border:0;margin:0;padding:0;min-width:0}.slider{margin-bottom:16px}.slider .slhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}.slider label{font-size:14px;font-weight:550;overflow-wrap:anywhere}.slider input[type=number]{width:86px;font:14px var(--mono);min-height:38px}.choice{margin:0 0 16px}.choice>label{display:block;font-size:14px;font-weight:550;margin-bottom:7px}.choice select{width:100%;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.actions button{flex:1;min-width:130px}.micro{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.6}.readout{font-size:14px;margin:0 0 16px;color:var(--ink)}.result{margin-top:24px;padding:24px;background:white;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px}.result.success{border-top-color:var(--green)}.result h2{font-size:23px;margin:0 0 10px;letter-spacing:-.025em;line-height:1.25}.result p{font-size:15px;margin:0 0 12px}.result .result-value{font:600 27px var(--mono);margin:10px 0;color:var(--green)}.result.failure .result-value{color:var(--red)}[hidden]{display:none!important}details{border-top:1px solid var(--line);padding-top:9px;margin-top:16px}summary{font-size:14px;font-weight:550;padding:7px 0}details p,details li{font-size:14px;line-height:1.65}.tablewrap{max-width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-weight:650}th,td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}th:first-child,td:first-child{padding-left:0}td.num{font-family:var(--mono);white-space:nowrap}.yes{color:var(--green);font-weight:650}.no{color:var(--red);font-weight:650}.bottom{margin-top:28px;color:var(--muted);font-size:13px}.caseform{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:12px 0}.caseform label{font-size:13px;display:block}.caseform input{width:170px}.share{width:100%;font-size:12px}.help{color:var(--muted);font-size:14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.hint{border-left:3px solid #b8a676;padding-left:12px;margin:12px 0;font-size:14px}.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:32px}.gamecard{background:white;border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;align-items:start}.gamecard .number{font:13px var(--mono);color:var(--red)}.gamecard h2{font-size:24px;line-height:1.2;letter-spacing:-.03em;margin:12px 0}.gamecard p{font-size:14px;color:var(--muted);margin:0 0 22px}.gamecard a.play{margin-top:auto;display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border-radius:5px;padding:10px 15px;font-size:14px;min-height:44px}.gamecard .topic{font-size:12px;color:var(--muted);margin-top:15px}.feedback{min-height:1.5em;color:var(--red);font-size:13px}
@media(max-width:840px){.workspace{grid-template-columns:1fr}.controlpanel{padding:20px}.controls .slider{max-width:100%}.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.casebar .caseid{margin-left:0;width:100%}main{padding-top:24px}}
@media(max-width:470px){main{padding:24px 16px 42px}.topnav{padding:14px 16px}.mission{padding:17px}.metric{padding:10px;min-width:90px}.metric strong{font-size:20px}.hub-grid{grid-template-columns:1fr}.casebar{gap:8px}.casebar button{font-size:14px;padding:9px 11px}.result{padding:20px}.actions button{min-width:110px}th,td{padding:8px 5px;font-size:12px}.prototype{font-size:11px}.statusline{gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* The challenge leads; review navigation and replay sit outside the working area. */
.mission .first-step{margin-top:10px;color:var(--green)}
.control-help{font-size:13px;line-height:1.45;color:var(--muted);margin:2px 0 0}
.slider{margin-bottom:19px}.chart-note{font-size:13px;color:var(--muted);line-height:1.6}
.replay{margin:28px 0 20px;padding-top:18px;border-top:1px solid var(--line)}
.replay>p{font-size:14px;color:var(--muted);max-width:740px;margin:0}
.replay .actions{justify-content:flex-start;margin-top:12px}.replay .actions button{flex:0 1 auto}
button.quiet{border-color:transparent;background:transparent;font-weight:400;text-decoration:underline;text-underline-offset:3px}
.budget-answer{font-size:14px;margin:4px 0 10px;width:100%}
.result .course-connection{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:13px}
body.embedded>header,body.embedded .gamebar{display:none}body.embedded main{padding-top:20px}body.embedded .review-about{display:none}
/* Divider shape chooser, live formula and draggable plot (Sort the recycling). */
.choice-label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.seg button{flex:1;min-width:0;padding:8px 10px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.formula{font:14px var(--mono);background:#f1f3ee;border-radius:5px;padding:10px 12px;margin:0 0 18px;overflow-wrap:anywhere}
.formula span{display:block;font:12px system-ui,sans-serif;color:var(--muted);margin-top:4px}
.plot.draggable svg{touch-action:none;cursor:grab}.plot.draggable svg:active{cursor:grabbing}
.plot text.map-label{font:600 12px var(--mono);fill:#202922;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
/* Build-a-network (Sort the recycling): palette, drop zone, piece cards. */
.palette{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.piece{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;font-size:14px;touch-action:none;cursor:grab}
.piece svg,.piece-ghost svg,.piece-head svg{width:24px;height:21px;color:var(--red);flex:none}
.piece-ghost{position:fixed;z-index:10;pointer-events:none;transform:translate(-50%,-60%);display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--ink);border-radius:5px;padding:8px 12px;font-size:14px;font-weight:550;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.choice-label small{font-weight:400;color:var(--muted);margin-left:6px}
.dropzone{border:2px dashed #b9c2b5;border-radius:7px;padding:10px;min-height:64px;display:flex;flex-direction:column;gap:8px;margin:0 0 14px;background:#fafbf8}
.dropzone.over{border-color:var(--green);background:#eef6ee}
.drop-hint{margin:6px 2px;font-size:13px;color:var(--muted)}
.piece-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.piece-head{display:flex;align-items:center;gap:8px}.piece-head strong{flex:1;font-size:14px}
.piece-head .remove{min-height:32px;min-width:32px;padding:0 8px;border-color:transparent;background:transparent;font-size:20px;line-height:1}
.piece-card details,.netbuild details.bias{border:0;margin:4px 0 0;padding:0}.piece-card summary,.netbuild details.bias summary{font-size:13px;font-weight:500;color:var(--muted);padding:4px 0}
.netbuild details.bias{margin:0 0 12px}
.mini{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}.mini output{font:13px var(--mono)}
.netbuild .actions{margin:0 0 10px}
/* Guide the robot home: replay buttons under Run, outcome outline on the frame, explainer beneath the widget. */
.controlpanel .again{display:flex;gap:10px;margin-top:10px}.controlpanel .again button{flex:1;min-width:0}
.plot{transition:box-shadow .25s}.plot.outcome-win{box-shadow:0 0 0 3px #216044}.plot.outcome-lose{box-shadow:0 0 0 3px #9f233b}
.plot text.map-label.win{fill:#216044}.plot text.map-label.lose{fill:#9f233b}
.explainer{max-width:760px;margin:30px 0 8px;padding-top:20px;border-top:1px solid var(--line)}
.explainer h2{font-size:19px;margin:0 0 10px;letter-spacing:-.015em}.explainer p{font-size:15px;line-height:1.65;margin:0 0 12px}
.explainer .explainer-link{color:var(--muted);font-size:14px}.explainer .explainer-note{color:var(--muted);font-size:13px}
/* MIT Learn palette for the rebuilt pages (robot, recycling): white ground, MIT red for actions, cool greys.
   Scoped by game so the other pilots keep their current look until they move over. */
body[data-game="optimizer"],body[data-game="shapes"]{--ink:#212326;--ink-2:#40464C;--muted:#626A73;--paper:#FFFFFF;--line:#DDE1E6;--red:#A31F34;--red-dark:#750014;--wash:#F3F4F8;background:#fff;color:var(--ink);font-family:"neue-haas-grotesk-text","Helvetica Neue",Helvetica,Arial,sans-serif}
body[data-game="optimizer"] header,body[data-game="shapes"] header{border-bottom-color:var(--line)}
body[data-game="optimizer"] h1,body[data-game="shapes"] h1{font-weight:700;letter-spacing:-.02em}
body[data-game="optimizer"] .lead,body[data-game="shapes"] .lead{color:var(--ink-2)}
body[data-game="optimizer"] .mission,body[data-game="shapes"] .mission{background:var(--wash);border-left:4px solid var(--red);border-radius:0 4px 4px 0}
body[data-game="optimizer"] .mission .first-step,body[data-game="shapes"] .mission .first-step{color:var(--ink-2)}
body[data-game="optimizer"] button,body[data-game="shapes"] button{border-color:#B8C2CC;border-radius:4px}
body[data-game="optimizer"] button.primary,body[data-game="shapes"] button.primary,body[data-game="optimizer"] button.accent,body[data-game="shapes"] button.accent{background:var(--red);border-color:var(--red);color:#fff}
body[data-game="optimizer"] button.primary:hover:enabled,body[data-game="shapes"] button.primary:hover:enabled,body[data-game="optimizer"] button.accent:hover:enabled,body[data-game="shapes"] button.accent:hover:enabled{filter:none;background:var(--red-dark);border-color:var(--red-dark)}
body[data-game="optimizer"] button.quiet,body[data-game="shapes"] button.quiet{border-color:transparent}
body[data-game="optimizer"] .controlpanel,body[data-game="shapes"] .controlpanel,body[data-game="optimizer"] .metric,body[data-game="shapes"] .metric,body[data-game="optimizer"] .plot,body[data-game="shapes"] .plot{border-color:var(--line);border-radius:6px}
body[data-game="optimizer"] .plot text,body[data-game="shapes"] .plot text{fill:var(--ink-2)}
body[data-game="optimizer"] .plot text.map-label.lose{fill:var(--red)}
body[data-game="optimizer"] .plot.outcome-lose{box-shadow:0 0 0 3px var(--red)}
body[data-game="shapes"] .formula{background:var(--wash)}
body[data-game="shapes"] .dropzone{background:#fff;border-color:#B8C2CC}
body[data-game="shapes"] .seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
/* Matched to MIT Learn's own chrome (rc.learn.mit.edu): #F3F4F8 page ground with white panels, #750014 primary
   actions, #DDE1E6 borders, near-black headings. Failure outlines stay the brighter #A31F34 so they read as errors. */
body[data-game="optimizer"],body[data-game="shapes"]{--red:#750014;--red-dark:#5A0010;--wash:#F3F4F8;--ink:#0C0C0D;background:#F3F4F8}
body[data-game="optimizer"] .mission,body[data-game="shapes"] .mission{background:#fff}
body[data-game="optimizer"] .plot,body[data-game="shapes"] .plot{background:#fff}
body[data-game="optimizer"] .plot text.map-label.lose{fill:#A31F34}
body[data-game="optimizer"] .plot.outcome-lose{box-shadow:0 0 0 3px #A31F34}
body[data-game="optimizer"] .explainer,body[data-game="shapes"] .explainer{border-top-color:#DDE1E6}
/* MIT Learn game format, after Arithmix: title bar, white game card with status, prompt, play area and footer,
   a "How to play" card beside it, the explainer card beneath. Used by Guide the robot home. */
body.gameformat{background:#F3F4F8}
body.gameformat main{max-width:1240px;padding:28px 24px 56px}
.gamebar{background:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:12px 24px;border-bottom:1px solid #E6E9EE}
.gamebar .back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#0C0C0D;border-radius:4px}
.gamebar .back svg{width:26px;height:26px}
.gamebar h1{grid-column:2;text-align:center;margin:0;font-size:clamp(26px,3vw,38px);font-weight:700;letter-spacing:-.02em;color:#0C0C0D}
.gamewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.playcard,.howto,body.gameformat .explainer{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 3px 10px rgba(16,24,40,.05)}
.playcard{overflow:hidden}
.gamestatus{display:flex;justify-content:center;gap:12px 40px;flex-wrap:wrap;padding:26px 24px 4px;font-size:18px;color:#626A73}
.gamestatus b{color:#212326;font-weight:600}.gamestatus b.win{color:#216044}.gamestatus b.lose{color:#A31F34}
.gameprompt{text-align:center;color:#626A73;font-size:17px;margin:8px 24px 18px}
.gameplay{padding:0 24px}.gameplay .plot{border:1px solid #DDE1E6}
.gameplay .legend{justify-content:center;margin:8px 0 0}.gameplay .readout{text-align:center;min-height:3.2em;margin:10px 0 0}
.gamecontrols{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;align-items:end;padding:14px 24px 24px}
.gamecontrols .controls{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.gamecontrols .slider{margin-bottom:0}
.gamecontrols .actions{margin:0 0 30px}.gamecontrols .actions button{min-width:190px}
.gamefoot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:18px 24px 22px;border-top:1px solid #E6E9EE;background:linear-gradient(#FBFBFC,#F6F7F9)}
.gamefoot p{margin:0 0 12px;font-size:16px;color:#626A73}.gamefoot strong{color:#212326;font-weight:600}
body.gameformat .gamefoot button{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #B8C2CC;border-radius:4px;padding:10px 22px;font-weight:500;color:#40464C;text-decoration:none}
.gamefoot button svg{width:22px;height:22px}
.howto{padding:24px}
.howto h2{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:500;margin:0 0 16px;color:#0C0C0D}.howto h2 svg{width:28px;height:20px;flex:none}
.howto p{font-size:15px;line-height:1.6;color:#212326;margin:0 0 14px}.howto strong{font-weight:700}
body.gameformat .explainer{max-width:none;margin-top:28px;padding:24px;border-top:0}
body.gameformat .review-about{margin-top:24px}
@media(max-width:900px){.gamewrap{grid-template-columns:1fr}.gamecontrols{grid-template-columns:1fr}.gamecontrols .actions{margin:0}.gamecontrols .actions button{width:100%}}
@media(max-width:560px){.gamecontrols .controls{grid-template-columns:1fr}.gamestatus{gap:6px 18px;font-size:16px}.gameprompt{font-size:15px}.gameplay,.gamecontrols,.gamefoot{padding-left:14px;padding-right:14px}}

.lr-readout{font:13px var(--mono);color:var(--ink-2);margin:6px 0 0}
.plot.outcome-over{box-shadow:0 0 0 3px #B45309}.plot text.map-label.over{fill:#B45309}.gamestatus b.over{color:#B45309}
/* Game format, shared across the rebuilt games. */
body.gameformat .plot.outcome-lose{box-shadow:0 0 0 3px #A31F34}body.gameformat .plot text.map-label.lose{fill:#A31F34}
body.gameformat .plot.outcome-over{box-shadow:0 0 0 3px #B45309}body.gameformat .plot text.map-label.over{fill:#B45309}
body.gameformat .plot.outcome-win{box-shadow:0 0 0 3px #216044}body.gameformat .plot text.map-label.win{fill:#216044}
.gamestatus b.over{color:#B45309}
/* Sort the recycling inside the game card: builder in two columns, no separate Check action. */
body.gameformat[data-game="shapes"] .gamecontrols{grid-template-columns:1fr}
body.gameformat[data-game="shapes"] .gamecontrols .controls{display:block}
body.gameformat[data-game="shapes"] .gamecontrols>.actions{display:none}
/* Sort the recycling: the network controls run long, so the plot and its reason line stay pinned in view while you adjust them.
   The card clips instead of hiding overflow, because overflow:hidden would stop the sticky plot. */
@media(min-height:680px){body.gameformat[data-game="shapes"] .playcard{overflow:clip}body.gameformat[data-game="shapes"]:not(.embedded) .gameplay{position:sticky;top:0;z-index:3;background:#fff;padding-top:12px;padding-bottom:2px;border-bottom:1px solid #E6E9EE}}
.netbuild{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 28px;align-items:start}
.netbuild .nb-right .actions{margin:0 0 8px}
@media(max-width:700px){.netbuild{grid-template-columns:1fr}}
/* Build a review filter inside the game card: sliders in two columns, the claim and phrase buttons full width. */
body.gameformat[data-game="nlp"] .gamecontrols{grid-template-columns:1fr}
body.gameformat[data-game="nlp"] .gamecontrols>.actions{display:none}
body.gameformat[data-game="nlp"] .gamecontrols .controls .budget-answer,body.gameformat[data-game="nlp"] .gamecontrols .controls #show-answer{grid-column:1/-1}
body.gameformat[data-game="nlp"] .gamecontrols .controls .slider{margin-bottom:12px}
/* MIT Learn chrome for every game in the format (the robot and recycling had it scoped by game). */
body.gameformat{--ink:#0C0C0D;--ink-2:#40464C;--muted:#626A73;--paper:#FFFFFF;--line:#DDE1E6;--red:#750014;--red-dark:#5A0010;--wash:#F3F4F8;color:#212326;font-family:"neue-haas-grotesk-text","Helvetica Neue",Helvetica,Arial,sans-serif}
body.gameformat button{border-color:#B8C2CC;border-radius:4px}
body.gameformat button.primary,body.gameformat button.accent{background:#750014;border-color:#750014;color:#fff}
body.gameformat button.primary:hover:enabled,body.gameformat button.accent:hover:enabled{filter:none;background:#5A0010;border-color:#5A0010}
body.gameformat button.quiet{border-color:transparent}
body.gameformat .plot{background:#fff}body.gameformat .plot text{fill:#40464C}
/* Course pages (course mode): course-only copy shown; arcade-only copy and links hidden. */
body:not(.course) .course-only{display:none}
body.course .arcade-only,body.course .explainer-link{display:none}
body.gameformat.course main{padding:12px 12px 16px}
</style>
</head>

<script>/* AI arcade review pilots. Pure, deterministic models and evaluators. */
(function (root) {

  // Adam for up to maxSteps; snapshots every few steps drive the animation. Stops early once every item
  // sits clearly on its side (loss below 0.05).

    const net=JSON.parse(JSON.stringify(start)),m={},v={},frames=[];let t=0;
    const upd=(o,key,gv,id)=>{m[id]=.9*(m[id]||0)+.1*gv;v[id]=.999*(v[id]||0)+.001*gv*gv;const mh=m[id]/(1-Math.pow(.9,t)),vh=v[id]/(1-Math.pow(.999,t)),[lo,hi]=NET_BOUNDS[key];o[key]=clamp(o[key]-.05*mh/(Math.sqrt(vh)+1e-8),lo,hi);};

  // Move strength 1-20 is an absolute learning rate, 0.02 to 0.40, the same in every valley. Valleys differ in how
  // sharp the charger's well is, so the rate at which a robot flies off changes from one valley to the next.
  const LR_STEP=.02,momenta=grid(0,.95,.05),strengths=grid(1,20,1),rateFor=(s,k)=>round(k*LR_STEP);
  // The robot's terrain: a stretched bowl, Gaussian features (the charger's well, sometimes a decoy dip, and
  // scenery hills and hollows), and gentle rolling ground that fades out near the charger.
  function robotLoss(s,x,y){
    const co=Math.cos(s.rotation),si=Math.sin(s.rotation),a=co*x+si*y,b=-si*x+co*y;
    let f=(s.bowl??1)*.5*(a*a+s.stretch*b*b);

  }
  function robotGrad(s,x,y){

  function robotRound(seed,level,kind){

  function confusion(s,t){

  // A brief is {brief, required, capacity}; the scenario itself is the first brief, s.next the second.
  function thresholdFeasible(b,c){return b.brief==='recall'?c.tp>=b.required:c.reviews<=b.capacity;}

    b.optimum=feasible.slice().sort((x,y)=>b.brief==='recall'?x.fp-y.fp: y.tp-x.tp || x.fp-y.fp)[0];

  // Nearly every seed works first time; a batch whose second request moves the best cutoff

    for(let attempt=0;attempt<8;attempt++){const s=thresholdBatch((seed+attempt*0x9E3779B9)>>>0,level);if(s&&s.next.gap>=5)return s;if(s&&(!best||s.next.gap>best.next.gap))best=s;}

  function thresholdBatch(seed,level){

    const s={positive:[],negative:[],brief:level==='guided'?'recall':choose(r,['recall','capacity']),recallGoal:level==='guided'?.8:choose(r,[.7,.8,.9]),capacity:choose(r,[15,25,40,55])};

      <p>A dip on the way down is a local minimum. The ground there is flat, so a robot with no carry-over stops as if it had arrived, and carry-over lets it coast up and over the rise. Carry-over can also hurt: with too much, the robot swings back and forth past the charger and cannot settle.</p>
      <p>The run stops once the robot has stayed within 0.10 of the charger for five moves in a row, or has come to rest anywhere else.</p>
      <p>Every valley is different. Some have a dip on the way down, some a sharp, narrow basin around the charger, and some a long, gentle approach. The same learning rate that races down a gentle valley flies off in a sharp one, which is why learning rate and momentum are tuned for each problem. Par asks for that tuning: reaching the charger is not enough, you need to get there efficiently.</p>
      <p class="explainer-link">${esc(CONNECTIONS.optimizer)}</p>
      <p class="explainer-note">Move strength 1 to 20 sets the learning rate from 0.02 to 0.40, the same scale in every valley. Par is 1.4 times the fewest moves any pair of settings needs (twice, on the first valley). Carry-over is the momentum coefficient. The 3D view exaggerates height for clarity; the robot moves on the true loss. This is a simplified homing simulation, not a physical robot model.</p>`});
  if(GAME==='shapes'&&COURSE)applyGameFormat({status:[['Batch','st-batch','1'],['Status','st-status','Building'],['Sorted','st-sorted','0 / 12'],['Pieces','st-pieces','0 / 3']],
    prompt:'Build a divider from up to three pieces, set its numbers by hand, then let training set them.',
    howto:['<strong>Pieces</strong> build the divider: a Straight piece, a Bend or a Step. Drag one onto the network, or press it.',
      '<strong>Set the numbers by hand</strong> first. Move the sliders under each piece, or drag the divider up and down, and watch which items change bins.',
      '<strong>Train</strong> unlocks once you have tried. It turns every number at once, pushing each item to its own side of the divider.',
      '<strong>New starting numbers</strong> retries training from a different start. Training can stall even with the right pieces.',
      '<strong>Fewest pieces</strong> wins. Some batches need two pieces, some only one.'],
    footLabel:'New batch',footTag:'some batches need a bend, some a step',newText:'New batch',newIcon:ICONS.batch,
    onNew:()=>{batchCount++;$('st-batch').textContent=batchCount;},
    explainerTitle:'What training did',
    explainer:`<p>A straight piece stops at 10 of 12 on these batches, whatever its numbers. A bend or a step lets the divider take the shape a batch needs, and after that the only question is which numbers to use.</p>
      <p>You turned some of those numbers yourself. Training turned all of them at once. It adjusts every number to lower a measured error, the cross-entropy loss, which grows the further an item sits on the wrong side of the divider, and it stops once every item is clearly on its side.</p>
      <p>Lecture 1 gives the pieces their names. The straight piece is a linear unit, m·x. The bend is a ReLU unit, k·ReLU(x − h). The step is a sigmoid unit, k·σ(w(x − h)). Which units you stack is fixed before training and decides which shapes the divider can take. The numbers inside them are learned from the data.</p>
      <p class="explainer-note">When training stops short of 12, either the pieces cannot make the shape the batch needs or training started badly, and New starting numbers tells the two apart. This is a toy dataset, not a model of real recycling materials.</p>`});
  else if(GAME==='shapes')applyGameFormat({status:[['Batch','st-batch','1'],['Status','st-status','Building'],['Sorted','st-sorted','0 / 12'],['Pieces','st-pieces','0 / 3']],
    prompt:'Build a divider from up to three pieces, then train it so cans land above and bottles below.',
    howto:['<strong>Pieces</strong> are the building blocks of the network: a Line, a ReLU bend or a Sigmoid step. Drag one onto the network, or press it.',
      '<strong>Train</strong> lets the network adjust every weight until the items sort. You choose the pieces; training chooses the numbers.',
      '<strong>New starting weights</strong> retries training from a different start. Training can stall even with the right pieces.',
      '<strong>Fewest pieces</strong> wins. Some batches need two pieces, some only one.'],
    footLabel:'New batch',footTag:'some batches need a bend, some a step',newText:'New batch',newIcon:ICONS.batch,
    onNew:()=>{batchCount++;$('st-batch').textContent=batchCount;},
    explainerTitle:'How the network sorts',
    explainer:`<p>Each item is placed by its size and its weight. The divider is a function y = f(x): an output bias plus the pieces you add. A Line adds m·x. A ReLU unit adds k·ReLU(x − h), a bend at h. A sigmoid unit adds k·σ(w(x − h)), a smooth step at h.</p>
      <p>Training adjusts every weight to lower the training error, a logistic loss on how far each item sits on the wrong side, and stops early once every item is clearly on its side. You choose the architecture and training chooses the parameters. Every network in the course is built with that same split.</p>
      <p>When training stops short of 12, there are two possible reasons: the pieces cannot make the shape the batch needs, or training started badly. New starting weights tells them apart. A straight line tops out at 10 of 12 on these batches. A V needs a bend, and a step needs a sigmoid or two bends.</p>
      <p class="explainer-link">${esc(CONNECTIONS.shapes)}</p>
      <p class="explainer-note">This is a toy dataset, not a model of real recycling materials.</p>`});
  if(GAME==='nlp')applyGameFormat({status:[['Request','st-request','1'],['Status','st-status','Sorting'],['Sorted','st-sorted','0 / 4'],['Features','st-features','Word points']],
    prompt:'Give words points so the filter sorts four film reviews the way the club asks.',
    howto:['<strong>Word points</strong> are added to every review that contains the word. A total above zero selects the review; below zero leaves it out.',
      '<strong>Starting score</strong> is added to every review before its word points. Exactly zero counts as undecided.',
      'Sort all four reviews the way the club asks. The result shows as soon as all four are right.',
      '<strong>Word points can’t sort all four</strong> appears once you have sorted three. If you decide no setting of word points can do it, say so. If you are right, phrase points unlock.'],
    footLabel:'New request',footTag:'some requests need phrases, some do not',newText:'New request',newIcon:ICONS.chat,
    onNew:()=>{requestCount++;$('st-request').textContent=requestCount;},
    explainerTitle:'What the filter can represent',
    explainer:`<p>Each review scores the starting score plus the points for the words it contains. A total above zero selects the review, below zero leaves it out, and exactly zero is undecided and counts as a mistake.</p>
      <p>This is a bag-of-words model: each word gets one weight, whatever words sit next to it. That is why “not” moves both negated reviews the same way. When a request needs “not good” and “not bad” to go in opposite directions, no setting of word points can do it, and recognising that limit is part of the task.</p>
      <p>Phrase points add a feature for each “not …” phrase. They are added on top of the word points, so the filter can treat a negated word differently from the same word on its own. Adding features like this is the first step toward models that represent word order and meaning.</p>
      <p class="explainer-link">${esc(CONNECTIONS.nlp)}</p>
      <p class="explainer-note">The reviews and word points are made up for this puzzle.</p>`});
  const params=new URLSearchParams(location.search),raw=params.get('seed'),n=raw===null?1:Number(raw),initialLevel=params.get('level')||(raw!==null&&n!==1?'standard':(COURSE||params.get('embed')==='1')&&GAME==='optimizer'?'course':'guided'); // a shared ?seed=N opens that round; in a lesson, the robot opens on the original's plain bowl
  if(COURSE||params.get('embed')==='1')document.body.classList.add('embedded');
  if(COURSE){
    document.body.classList.add('course');
    if(GAME==='optimizer'){const b=document.createElement('button');b.type='button';b.id='bowl';b.innerHTML=ICONS.terrain+'The bowl';b.addEventListener('click',()=>{valleyCount++;$('st-valley').textContent=valleyCount;start(1,'course');});document.querySelector('.foot-buttons').append(b);}
    // Size the course page's frame to the game when the page allows it (same origin); otherwise its set height stands.
    const fit=()=>{try{const f=window.frameElement,m=document.querySelector('main');if(f&&m){const h=Math.ceil(m.getBoundingClientRect().bottom+window.scrollY+8);if(Math.abs(f.offsetHeight-h)>4)f.style.height=h+'px';}}catch(e){}};
    if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(document.body);
    window.addEventListener('load',fit);
  }
  start(Number.isInteger(n)&&n>=0&&n<=4294967295?n:1,initialLevel);
})();
</script>
