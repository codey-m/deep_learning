<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6.7960x — Glossary</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #FAFAF8; color: #1A1A1A; min-height: 100vh; }
    #app { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    #header { margin-bottom: 1.75rem; }
    #header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 2px; }
    #header p { font-size: 13px; color: #595959; font-family: 'Courier New', monospace; letter-spacing: 0.04em; }
    #search-wrap { position: relative; margin-bottom: 0.75rem; }
    #search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #aaa; pointer-events: none; }
    #gs { width: 100%; padding: 10px 12px 10px 36px; font-size: 15px; font-family: inherit; border: 1px solid #DDD; border-radius: 6px; background: #FFF; color: #1A1A1A; outline: none; transition: border-color 0.15s; }
    #gs:focus { border-color: #595959; }
    #gs::placeholder { color: #6E6E6E; }
    #uf { display: flex; flex-wrap: wrap; border-bottom: 1px solid #EEE; margin-bottom: 0.5rem; }
    .ub { background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 14px 6px; font-size: 12px; font-family: 'Courier New', monospace; letter-spacing: 0.05em; cursor: pointer; color: #595959; transition: color 0.12s; }
    .ub.on { color: #1A1A1A; border-bottom-color: #1A1A1A; font-weight: 600; }
    .ub:hover { color: #1A1A1A; }
    #gc { font-size: 11px; color: #6E6E6E; font-family: 'Courier New', monospace; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
    .lh { font-size: 11px; color: #767676; padding: 16px 0 5px; border-bottom: 1px solid #EEE; font-family: 'Courier New', monospace; letter-spacing: 0.1em; }
    .tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid #F0F0F0; }
    .tn { font-size: 18px; font-weight: 600; margin-bottom: 3px; color: #1A1A1A; }
    .no { font-family: 'Courier New', monospace; font-size: 12px; background: #F4F4F2; color: #666; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .td { font-size: 14px; color: #555; line-height: 1.7; }
    .ut { font-family: 'Courier New', monospace; font-size: 10px; background: #F4F4F2; color: #6E6E6E; padding: 3px 8px; border-radius: 4px; white-space: nowrap; align-self: start; margin-top: 4px; display: flex; align-items: center; gap: 5px; letter-spacing: 0.04em; }
    .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    mark { background: #FFF3CC; color: #7A5C00; border-radius: 2px; padding: 0 1px; }
    #empty { color: #6E6E6E; font-size: 14px; padding: 3rem 0; text-align: center; font-family: 'Courier New', monospace; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>6.7960x — Glossary</h1>
    <p>MODULE 4 &nbsp;·&nbsp; REPRESENTATIONS AND WEIGHT SPACE</p>
  </div>
  <div id="search-wrap">
    <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="gs" type="search" placeholder="Search terms, definitions, notation…" aria-label="Search glossary" />
  </div>
  <div id="uf" role="tablist" aria-label="Filter by unit"></div>
  <p id="gc" aria-live="polite"></p>
  <div id="gl" role="list"></div>
</div>

<script>
// ─── Module configuration ───────────────────────────────────────────────────
// Update MODULE.name and MODULE.subtitle per module.
// Units should reflect the conceptual groupings covered in this module only.
const MODULE = {
  name: "Module 4",
  subtitle: "Representations and weight space",
  course: "6.7960x",
};

// Unit dot colors — add/remove units here to match what this module covers.
// Values are mid-ramp accent colors; they work on both light backgrounds.
const UNIT_COLORS = {
  "Analyzing representations": "#BA7517",
  "Reconstruction methods": "#378ADD",
  "Similarity methods": "#1D9E75",
  "Weight space": "#7F77DD",
};

// ─── Term data ───────────────
const T = [

  // Analyzing representations
  {
    term: "Representation",
    notation: null,
    unit: "Analyzing representations",
    def: "The features a trained network computes inside itself, as opposed to its final prediction. What they encode is what transfers to a new task.",
  },
  {
    term: "Embedding",
    notation: null,
    unit: "Analyzing representations",
    def: "The vector a network assigns to an input. Distances between embeddings are how a representation expresses similarity.",
  },
  {
    term: "Linear probe",
    notation: null,
    unit: "Analyzing representations",
    def: "A small linear classifier trained on frozen features to ask what a representation already encodes, without changing the representation itself.",
  },
  {
    term: "Shuffled-label control",
    notation: null,
    unit: "Analyzing representations",
    def: "The same probe fitted to randomly relabeled data. Its score is what a probe can reach by memorizing alone, so the gap above it is the part attributable to the representation.",
  },
  {
    term: "Selectivity",
    notation: null,
    unit: "Analyzing representations",
    def: "The held-out probe score minus its shuffled-label control, reported in percentage points.",
  },
  {
    term: "Frozen encoder",
    notation: null,
    unit: "Analyzing representations",
    def: "A network whose weights are held fixed while something small is trained on top, so any comparison reports the representation rather than the training that followed.",
  },
  {
    term: "Downstream task",
    notation: null,
    unit: "Analyzing representations",
    def: "The task a representation is finally judged on, distinct from whatever objective produced it.",
  },

  // Reconstruction methods
  {
    term: "k-means clustering",
    notation: null,
    unit: "Reconstruction methods",
    def: "A classical method that groups points around k centers, used here as a baseline for structure a learned representation might also find.",
  },
  {
    term: "Principal component analysis",
    notation: "PCA",
    unit: "Reconstruction methods",
    def: "A classical method that finds the directions capturing the most variance in the data, giving a linear baseline against which learned features are compared.",
  },
  {
    term: "Autoencoder",
    notation: null,
    unit: "Reconstruction methods",
    def: "A network trained to rebuild its own input through a narrower middle, so the middle has to keep whatever the reconstruction needs.",
  },
  {
    term: "Bottleneck",
    notation: null,
    unit: "Reconstruction methods",
    def: "The narrow layer an autoencoder squeezes its input through. Its width sets how much can survive the round trip.",
  },
  {
    term: "Reconstruction loss",
    notation: null,
    unit: "Reconstruction methods",
    def: "The error between an input and its rebuild. Accurate reconstruction does not on its own mean the representation is organized usefully.",
  },
  {
    term: "Masked autoencoder",
    notation: null,
    unit: "Reconstruction methods",
    def: "An autoencoder trained to fill in deliberately hidden parts of its input, which forces it to model content rather than copy it.",
  },
  {
    term: "Masking ratio",
    notation: null,
    unit: "Reconstruction methods",
    def: "The fraction of the input hidden before reconstruction. Hide too little and copying nearby visible content suffices; hide more and the task demands real structure.",
  },

  // Similarity methods
  {
    term: "Metric learning",
    notation: null,
    unit: "Similarity methods",
    def: "Training a representation directly on what should count as similar, rather than on a classification target.",
  },
  {
    term: "Contrastive learning",
    notation: null,
    unit: "Similarity methods",
    def: "Learning a representation by pulling related examples together and pushing unrelated ones apart, with no labels required.",
  },
  {
    term: "Positive pair",
    notation: null,
    unit: "Similarity methods",
    def: "Two views the objective treats as the same thing. Which views are paired is what decides the invariances the representation ends up with.",
  },
  {
    term: "Negative example",
    notation: null,
    unit: "Similarity methods",
    def: "An example the objective pushes away from the anchor. One that is actually related is a false negative, and it teaches the wrong distinction.",
  },
  {
    term: "Data augmentation",
    notation: null,
    unit: "Similarity methods",
    def: "The transformations applied to make a second view of an example. A representation learns to ignore whatever the augmentation changes.",
  },
  {
    term: "Invariance",
    notation: null,
    unit: "Similarity methods",
    def: "A change in the input that leaves the representation alone. It is created deliberately by what the positive pairs vary.",
  },
  {
    term: "Precision at k",
    notation: null,
    unit: "Similarity methods",
    def: "Of the k nearest neighbors of a query embedding, the fraction that are genuinely related. It reports whether a neighborhood is clean, which an aggregate score can hide.",
  },

  // Weight space
  {
    term: "Weight space",
    notation: null,
    unit: "Weight space",
    def: "The space whose points are whole settings of a network's weights, so one point is one learned function rather than one input.",
  },
  {
    term: "Permutation symmetry",
    notation: null,
    unit: "Weight space",
    def: "Reordering hidden units, with their incoming and outgoing connections, leaves the function unchanged. Two weight vectors can therefore look far apart and compute the same thing.",
  },
  {
    term: "Function-preserving rescaling",
    notation: null,
    unit: "Weight space",
    def: "Scaling a ReLU unit's incoming weights and bias by a positive factor and dividing its outgoing weight by the same factor, which leaves the function it computes unchanged.",
  },
  {
    term: "Loss landscape",
    notation: null,
    unit: "Weight space",
    def: "The surface the loss traces over weight space. Its shape near a solution is what talk of flat and sharp minima refers to.",
  },
  {
    term: "Flat and sharp minima",
    notation: null,
    unit: "Weight space",
    def: "How quickly the loss rises as the weights move away from a solution. Flatness measured along raw coordinates is not by itself evidence about generalization, because rescaling changes it without changing the function.",
  },
  {
    term: "Simplicity bias",
    notation: null,
    unit: "Weight space",
    def: "The tendency of training to land on simpler functions among the many that fit, which is part of why heavily overparameterized networks still generalize.",
  },
  {
    term: "Model steering",
    notation: null,
    unit: "Weight space",
    def: "Editing weights directly to change behavior, rather than retraining. Edits that help one task can cost another, so the trade has to be checked.",
  },
  {
    term: "Learned update rule",
    notation: null,
    unit: "Weight space",
    def: "A model trained to propose weight updates. Judging whether it transfers means holding out whole runs or tasks, because nearby checkpoints from one trajectory are not independent.",
  },
];
// ─────────────────────────────────────────────────────────────────────────────

const UNITS = ["All", ...Object.keys(UNIT_COLORS)];

let q = "", u = "All";

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function hi(text, query) {
  const e = esc(text);
  if (!query.trim()) return e;
  const re = new RegExp(
    "(" + query.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")",
    "gi"
  );
  return e.replace(re, "<mark>$1</mark>");
}

function render() {
  const ql = q.toLowerCase();
  const f = T.filter(t => {
    const mu = u === "All" || t.unit === u;
    const mq = !ql
      || t.term.toLowerCase().includes(ql)
      || t.def.toLowerCase().includes(ql)
      || (t.notation && t.notation.toLowerCase().includes(ql));
    return mu && mq;
  }).sort((a, b) => a.term.localeCompare(b.term));

  const countEl = document.getElementById("gc");
  countEl.textContent = T.length === 0
    ? "No terms loaded yet."
    : `${f.length} term${f.length !== 1 ? "s" : ""}${q ? ` matching "${q}"` : ""}`;

  const grps = {};
  f.forEach(t => {
    const l = t.term[0].toUpperCase();
    if (!grps[l]) grps[l] = [];
    grps[l].push(t);
  });

  const gl = document.getElementById("gl");
  if (!f.length) {
    gl.innerHTML = `<p id="empty">No terms found.</p>`;
    return;
  }

  gl.innerHTML = Object.entries(grps)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([letter, terms]) => `
      <div class="lh" aria-hidden="true">${letter}</div>
      ${terms.map(t => `
        <div class="tr" role="listitem">
          <div>
            <p class="tn">${hi(t.term, q)}</p>
            ${t.notation ? `<span class="no">${esc(t.notation)}</span>` : ""}
            <p class="td">${hi(t.def, q)}</p>
          </div>
          <span class="ut" aria-label="${esc(t.unit)}">
            <span class="dot" style="background:${UNIT_COLORS[t.unit] || '#CCC'}"></span>
            ${esc(t.unit)}
          </span>
        </div>
      `).join("")}
    `).join("");
}

// Render unit filter buttons
const ufEl = document.getElementById("uf");
ufEl.innerHTML = UNITS.map(un =>
  `<button class="ub${u === un ? " on" : ""}" data-unit="${esc(un)}" role="tab" aria-selected="${u === un}">${esc(un)}</button>`
).join("");

ufEl.addEventListener("click", e => {
  const b = e.target.closest(".ub");
  if (!b) return;
  u = b.dataset.unit;
  document.querySelectorAll(".ub").forEach(x => {
    x.classList.toggle("on", x.dataset.unit === u);
    x.setAttribute("aria-selected", x.dataset.unit === u);
  });
  render();
});

document.getElementById("gs").addEventListener("input", e => {
  q = e.target.value;
  render();
});

render();
</script>
</body>
</html>
